services:
  webservice:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: redact-backend
    restart: always
    networks:
      - backend

  redact-frontend-prod:
    profiles: ["prod"]
    container_name: redact-frontend-prod
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NGINX_CONFIG: frontend/nginx.conf
    ports:
      - "127.0.0.1:8880:80"
    restart: always
    networks:
      - backend

  redact-frontend-dev:
    profiles: ["dev"]
    container_name: redact-frontend-dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NGINX_CONFIG: frontend/nginx.conf
    ports:
      - "8880:80"
    restart: always
    networks:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./dev/
        - action: rebuild
          path: ./frontend/

networks:
  backend:
    driver: bridge
