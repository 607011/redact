<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/SourceSansPro-Regular.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/SourceSansPro-Bold.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/SourceCodePro-Regular.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/SourceCodePro-Bold.woff2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A tool to analyze █████████ text by highlighting important words and phrases.">
    <meta name="keywords" content="redact, text analysis, privacy, redaction tool, ██████████, text highlighter">
    <meta name="author" content="██████ ███">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='0' y='2' width='20' height='7'/><rect x='22' y='2' width='10' height='7'/><rect x='0' y='11' width='7' height='7'/><rect x='9' y='11' width='17' height='7'/><rect x='0' y='20' width='10' height='7'/><rect x='12' y='20' width='17' height='7'/></svg>">
    <title>Redac&apos;t</title>
    <style>
        @font-face {
            font-family: 'Source Sans Pro';
            src: url('/static/fonts/SourceSansPro-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Source Sans Pro';
            src: url('/static/fonts/SourceSansPro-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Source Code Pro';
            src: url('/static/fonts/SourceCodePro-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Source Code Pro';
            src: url('/static/fonts/SourceCodePro-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #222;
                color: #eee;
            }

            header {
                background-color: #0D1A2b;
                color: #eee;
            }

            footer {
                background-color: #0D1A2b;
                color: #eee;
            }

            #editor {
                color: #eee;
                caret-color: #eee;
            }

            #editor:empty::before {
                color: #555;
            }

            #editor-wrapper {
                background-color: #070f18;
            }

            #highlighter span {
                opacity: 0.7;
            }

            #highlighter.redact span {
                background-color: #eee !important;
                color: transparent !important;
                opacity: 1 !important;
            }
        }

        @media (prefers-color-scheme: light) {
            body {
                background-color: white;
                color: #111;
            }

            header {
                background-color: #14315b;
                color: white;
            }

            footer {
                background-color: #14315b;
                color: white;
            }

            #editor {
                color: black;
                caret-color: black;
            }

            #editor:empty::before {
                color: #aaa;
            }

            #editor-wrapper {
                background-color: white;
            }

            #highlighter.redact>span {
                background-color: black !important;
            }
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-family: 'Source Sans Pro', Arial, sans-serif;
        }

        h1 {
            font-size: 24px;
        }

        header {
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        main {
            flex: 1;
            display: flex;
            gap: 0;
            overflow-y: auto;
        }

        footer {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 10px;
        }

        #editor-wrapper {
            position: relative;
            flex: 1;
            height: 100%;
            overflow-y: auto;
        }

        .container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100%;
            padding: 15px;
            margin: 0;
            font-family: 'Source Code Pro', monospace;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: none;
        }

        #editor {
            z-index: 2;
            background: transparent;
            outline: none;
            overflow: hidden;
        }

        #editor:empty::before {
            content: attr(data-placeholder);
            pointer-events: none;
        }

        #highlighter {
            z-index: 1;
            color: transparent;
            user-select: none;
            pointer-events: none;
            overflow: hidden;
        }

        #highlighter span {
            color: transparent;
            border-radius: 2px;
            transition: background-color 0.3s ease, opacity 0.3s ease;
        }

        .controls {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .controls>div {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
        }

        footer {
            font-size: smaller;
            padding: 10px;
            text-align: center;
        }

        select {
            padding: 5px;
        }

        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loader-dots {
            display: flex;
            gap: 10px;
        }

        .loader-dots span {
            width: 16px;
            height: 16px;
            background: #1f5093;
            border-radius: 50%;
            animation: bounce 0.3s ease-in-out infinite alternate;
        }

        .loader-dots span:nth-child(2) {
            animation-delay: 0.1s;
        }

        .loader-dots span:nth-child(3) {
            animation-delay: 0.2s;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
                scale: 1.2;
            }

            to {
                transform: translateY(-22px);
                scale: 1;
            }
        }

        button {
            cursor: pointer;
        }

        button#color-mode {
            width: 24px;
            height: 24px;
        }
    </style>
</head>

<body>
    <div class="loader-overlay">
        <div class="loader-dots">
            <span></span><span></span><span></span>
        </div>
    </div>
    <header>
        <h1>Redac&apos;t</h1>
        <div class="controls">
            <select id="model-select" title="Select model">
                <option value="">Loading models &hellip;</option>
            </select>
            <datalist id="steplist">
                <option value="0"></option>
                <option value="40"></option>
                <option value="70"></option>
                <option value="90"></option>
                <option value="100"></option>
            </datalist>
            <button id="color-mode" title="Toggle color mode">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 32 32">
                    <defs>
                        <g id="redact-icon-black">
                            <rect x="0" y="2" width="20" height="7" />
                            <rect x="22" y="2" width="10" height="7" />
                            <rect x="0" y="11" width="7" height="7" />
                            <rect x="9" y="11" width="17" height="7" />
                            <rect x="0" y="20" width="10" height="7" />
                            <rect x="12" y="20" width="17" height="7" />
                        </g>
                    </defs>
                    <defs>
                        <g id="redact-icon-colored">
                            <rect x="0" y="2" width="20" height="7" fill="orange" />
                            <rect x="22" y="2" width="10" height="7" fill="red" />
                            <rect x="0" y="11" width="7" height="7" fill="lightgreen" />
                            <rect x="9" y="11" width="17" height="7" fill="yellow" />
                            <rect x="0" y="20" width="10" height="7" fill="green" />
                            <rect x="12" y="20" width="17" height="7" fill="orange" />
                        </g>
                    </defs>
                    <use href="#redact-icon-black" />
                </svg>

            </button>
            <div>
                <label for="single-level">Word</label>
                <input type="range" id="single-level" min="0" max="4" step="1" list="steplist">
            </div>
            <div>
                <label for="phrase-level">Phrase</label>
                <input type="range" id="phrase-level" min="0" max="4" step="1" list="steplist">
            </div>
            <button id="download-redacted" title="Download Redacted Text"
                style="background: none; border: none; cursor: pointer; color: white; vertical-align: middle; padding: 0 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
            </button>
        </div>
    </header>

    <main>
        <div id="editor-wrapper">
            <div id="highlighter" class="container" spellcheck="false"></div>
            <div id="editor" class="container" contenteditable="true" spellcheck="false"
                data-placeholder="Paste or type your text here to highlight words by importance. Caution: pasting replaces existing content!">
            </div>
        </div>
    </main>

    <footer>
        <legend>least important
            <svg xmlns="http://www.w3.org/2000/svg" width="100" height="1em" viewBox="0 0 100 1"
                preserveAspectRatio="none">
                <defs>
                    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="green" />
                        <stop offset="50%" stop-color="yellow" />
                        <stop offset="100%" stop-color="red" />
                    </linearGradient>
                </defs>
                <rect width="100" height="1" fill="url(#gr)" />
            </svg>
            most important
        </legend>
        <div>&copy; 2026 ███████. All rights reserved.</div>
    </footer>
</body>

<script>
    (function (window) {
        // container for DOM elements of interest
        const el = {};
        const API_VERSION = 'v1';
        const HEALTH_ENDPOINT = `/api/${API_VERSION}/health`;
        const LANGUAGE_ENDPOINT = `/api/${API_VERSION}/language`;
        const ANALYZE_ENDPOINT = `/api/${API_VERSION}/analyze`;
        const REDACT_ENDPOINT = `/api/${API_VERSION}/redact`;

        let analysisTimeout;
        const analysisCache = new Map();
        const activeRequests = new Map();

        function fetchWithCancel(url, options = {}) {
            if (activeRequests.has(url)) {
                activeRequests.get(url).abort();
            }
            const controller = new AbortController();
            activeRequests.set(url, controller);
            return fetch(url, { ...options, signal: controller.signal })
                .finally(() => {
                    if (activeRequests.get(url) === controller) {
                        activeRequests.delete(url);
                    }
                });
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function getEditorText() {
            return el.editor.innerText.replace(/\r\n|\r/g, '\n').replace(/\n$/, '');
        }

        async function downloadRedactedText() {
            const text = getEditorText();
            if (!text.trim())
                return;
            const datalistOptions = Array.from(document.querySelectorAll('#steplist option')).map(opt => parseInt(opt.value));
            const phraseValue = datalistOptions[document.getElementById('phrase-level').value];
            const singleValue = datalistOptions[document.getElementById('single-level').value];
            const modes = [];
            if (phraseValue > 0)
                modes.push({ type: 'phrase', level: phraseValue });
            if (singleValue > 0)
                modes.push({ type: 'single', level: singleValue });
            try {
                showLoader();
                const response = await fetchWithCancel(REDACT_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        modes: modes,
                        model: el.modelSelect.value,
                    })
                });
                const data = await response.json();
                const blob = new Blob([data.redacted_text], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                a.href = url;
                a.download = `redacted_final_${timestamp}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            catch (error) {
                console.error('Download failed:', error);
            }
            finally {
                hideLoader();
            }
        }

        async function analyzeText() {
            if (!el.editor || getEditorText().length === 0)
                return;
            const modes = [];
            const datalistOptions = Array.from(document.querySelectorAll('#steplist option')).map(opt => parseInt(opt.value));
            const phraseLevel = parseInt(document.getElementById('phrase-level').value);
            const phraseValue = datalistOptions[phraseLevel];
            if (phraseValue > 0) {
                modes.push({
                    type: 'phrase',
                    level: phraseValue,
                });
            }
            const singleLevel = parseInt(document.getElementById('single-level').value);
            const singleValue = datalistOptions[singleLevel];
            if (singleValue > 0) {
                modes.push({
                    type: 'single',
                    level: singleValue,
                });
            }
            const originalText = getEditorText();
            const cacheKey = JSON.stringify({ modes, model: el.modelSelect.value });
            try {
                showLoader();
                let data;
                if (analysisCache.has(cacheKey)) {
                    data = analysisCache.get(cacheKey);
                }
                else {
                    const response = await fetchWithCancel(ANALYZE_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: originalText,
                            modes: modes,
                            model: el.modelSelect.value,
                        })
                    });
                    data = await response.json();
                    analysisCache.set(cacheKey, data);
                }
                let html = '';
                let cursor = 0;
                for (const [start, end, importance] of data.analysis) {
                    if (start > cursor) {
                        html += escapeHtml(originalText.slice(cursor, start));
                    }
                    const hue = (1 - importance) * 120;
                    html += `<span style="background-color: hsla(${hue.toFixed(0)}, 80%, 50%, 0.8);">${escapeHtml(originalText.slice(start, end))}</span>`;
                    cursor = end;
                }
                if (cursor < originalText.length) {
                    html += escapeHtml(originalText.slice(cursor));
                }

                el.highlighter.innerHTML = html.replace(/\n/g, '<br>');
            }
            catch (error) {
                console.error('Analysis failed:', error);
            }
            finally {
                hideLoader();
            }
        }

        function analyzeTextDebounced() {
            if (analysisTimeout) {
                clearTimeout(analysisTimeout);
            }
            analysisTimeout = setTimeout(() => {
                analyzeText();
            }, 400);
        }

        function onInput() {
            const text = getEditorText();
            if (text.length === 0) {
                el.highlighter.innerHTML = '';
                localStorage.removeItem('editorContent');
                return;
            }
            analysisCache.clear();
            localStorage.setItem('editorContent', getEditorText());
            analyzeTextDebounced();
        }

        function onSliderChange() {
            localStorage.setItem('phraseLevel', el.phraseSlider.value);
            localStorage.setItem('singleLevel', el.singleSlider.value);
            analyzeTextDebounced();
        }

        function onModelChange() {
            localStorage.setItem('selectedModel', el.modelSelect.value);
            analyzeTextDebounced();
        }

        function showLoader() {
            el.loaderOverlay.style.display = 'flex';
        }

        function hideLoader() {
            el.loaderOverlay.style.display = 'none';
        }

        async function guessLanguage() {
            const originalText = getEditorText();
            try {
                const response = await fetchWithCancel(LANGUAGE_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: originalText })
                });
                const data = await response.json();
                return data.language;
            }
            catch (error) {
                console.error('Language detection failed:', error);
                return null;
            }
        }

        async function checkHealth() {
            try {
                const response = await fetchWithCancel(HEALTH_ENDPOINT);
                const data = await response.json();
                if (data.status !== 'healthy') {
                    console.error('Backend not reachable. Please try again later.');
                    el.modelSelect.innerHTML = '<option value="">Backend not reachable</option>';
                    return;
                }
                const AVAILABLE_LANGS = ['en', 'fr', 'de'];
                let userLang = (navigator.language || navigator.userLanguage || 'en').split('-')[0];
                if (!AVAILABLE_LANGS.includes(userLang)) {
                    userLang = 'en';
                }
                el.modelSelect.innerHTML = '';
                data.models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model;
                    option.textContent = model;
                    if (model.startsWith(userLang)) {
                        option.selected = true;
                    }
                    el.modelSelect.appendChild(option);
                });
                const savedModel = localStorage.getItem('selectedModel');
                if (savedModel && data.models.includes(savedModel)) {
                    el.modelSelect.value = savedModel;
                    analyzeText();
                }
            }
            catch (error) {
                console.error('Health check failed:', error);
                el.modelSelect.innerHTML = '<option value="">Backend not reachable</option>';
            }
            finally {
                hideLoader();
            }
        }

        function toggleColorMode() {
            el.highlighter.classList.toggle('redact');
            const useEl = el.colorModeButton.querySelector('use');
            if (useEl.getAttribute('href') === '#redact-icon-colored') {
                useEl.setAttribute('href', '#redact-icon-black');
            }
            else {
                useEl.setAttribute('href', '#redact-icon-colored');
            }
        }

        function setup() {
            el.modelSelect = document.getElementById('model-select');
            el.modelSelect.addEventListener('change', onModelChange);
            el.highlighter = document.getElementById('highlighter');
            el.editor = document.getElementById('editor');
            el.editor.textContent = localStorage.getItem('editorContent') || '';
            el.editor.addEventListener('input', onInput);
            el.editor.addEventListener('paste', e => {
                e.preventDefault();
                const text = (e.originalEvent || e).clipboardData.getData('text/plain').replace(/\r\n|\r/g, '\n');
                el.editor.textContent = text;
                onInput();
                guessLanguage().then(lang => {
                    if (lang) {
                        const modelOption = Array.from(el.modelSelect.options).find(opt => opt.value.startsWith(lang));
                        if (modelOption && localStorage.getItem('selectedModel') !== modelOption.value) {
                            el.modelSelect.value = modelOption.value;
                            onModelChange();
                        }
                    }
                });
            });
            el.phraseSlider = document.getElementById('phrase-level');
            el.phraseSlider.addEventListener('input', onSliderChange);
            el.phraseSlider.value = localStorage.getItem('phraseLevel') || el.phraseSlider.value;
            el.singleSlider = document.getElementById('single-level');
            el.singleSlider.addEventListener('input', onSliderChange);
            el.singleSlider.value = localStorage.getItem('singleLevel') || el.singleSlider.value;
            el.loaderOverlay = document.querySelector('.loader-overlay');
            document.getElementById('download-redacted').addEventListener('click', downloadRedactedText);
            el.colorModeButton = document.getElementById('color-mode');
            el.colorModeButton.addEventListener('click', toggleColorMode);
            checkHealth()
                .then(analyzeText)
                .catch(error => {
                    console.error('Setup failed:', error);
                });
        }

        document.addEventListener('DOMContentLoaded', setup);
    })(window);
</script>

</html>
